{{define "head"}}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · pageforge</title>
<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px; margin: 0 auto; padding: 1.5rem; line-height: 1.5; }
nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #8884; }
nav .brand { font-weight: 700; font-size: 1.2rem; text-decoration: none; color: inherit; }
nav .user { display: flex; gap: 1rem; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #8884; }
.badge { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; border: 1px solid #8888; }
.badge.live { border-color: #2a2; color: #2a2; }
.badge.private { border-color: #a82; color: #a82; }
button, .btn { font: inherit; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #8888; background: none; color: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
button.primary, .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
button.danger { border-color: #a33; color: #a33; }
button:hover, .btn:hover { filter: brightness(1.15); }
form.inline { display: inline; }
label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
input[type=text], select { font: inherit; padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid #8888; width: 100%; max-width: 420px; background: none; color: inherit; }
.checkbox-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; }
.checkbox-row label { margin: 0; font-weight: normal; }
.hint { color: #888; font-size: 0.9rem; }
.error { background: #a331; border: 1px solid #a33; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
.site-url { font-family: monospace; background: #8882; padding: 0.5rem 0.75rem; border-radius: 6px; }
.actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; align-items: center; }
code { font-family: monospace; }
</style>
</head>
{{end}}

{{define "nav"}}
<nav>
  <a class="brand" href="/">pageforge</a>
  <div class="user">
    {{if .User}}
      <span>{{.User.Username}}</span>
      <form class="inline" method="post" action="/logout"><button type="submit">Log out</button></form>
    {{else}}
      <a class="btn" href="/login">Log in with Forgejo</a>
    {{end}}
  </div>
</nav>
{{end}}
